<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tuna akin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0a0a0a;
        --bg-1: #0e0e0e;
        --bg-2: #141414;
        --line: #1f1f1f;
        --line-2: #2a2a2a;
        --fg: #e6e6e6;
        --fg-dim: #8a8a8a;
        --fg-dimmer: #5a5a5a;
        --accent-h: 75;
        --accent: oklch(0.8 0.14 var(--accent-h));
        --accent-dim: oklch(0.8 0.14 var(--accent-h) / 0.5);
        --accent-faint: oklch(0.8 0.14 var(--accent-h) / 0.12);
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --sans: "Inter", system-ui, -apple-system, sans-serif;
        --grid-alpha: 0.04;
        --scan-alpha: 0.025;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: var(--bg);
        color: var(--fg);
      }
      body {
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      /* texture layers — fixed, behind everything */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, var(--grid-alpha)) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, var(--grid-alpha)) 1px,
            transparent 1px
          );
        background-size: 32px 32px;
        pointer-events: none;
        z-index: 0;
        mask-image: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.4) 70%,
          rgba(0, 0, 0, 0.1) 100%
        );
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(255, 255, 255, var(--scan-alpha)) 3px,
          rgba(255, 255, 255, var(--scan-alpha)) 3px
        );
        pointer-events: none;
        z-index: 1;
        mix-blend-mode: overlay;
      }

      #app {
        position: relative;
        z-index: 2;
      }

      /* ---------- top bar ---------- */
      .topbar {
        position: sticky;
        top: 0;
        backdrop-filter: blur(6px);
        background: rgba(10, 10, 10, 0.72);
        border-bottom: 1px solid var(--line);
        z-index: 50;
      }
      .topbar-inner {
        max-width: 920px;
        margin: 0 auto;
        padding: 14px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 13px;
      }
      .brand {
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      .brand .at {
        color: var(--fg-dim);
      }
      .brand .host {
        color: var(--fg-dim);
      }
      .brand .accent {
        color: var(--accent);
      }
      .navlinks {
        display: flex;
        gap: 22px;
      }
      .navlinks a {
        color: var(--fg-dim);
        text-decoration: none;
        transition: color 120ms ease;
      }
      .navlinks a:hover {
        color: var(--fg);
      }
      .navlinks a .hash {
        color: var(--fg-dimmer);
        margin-right: 1px;
      }

      /* ---------- shell ---------- */
      .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 0 32px;
      }

      /* ---------- section heads ---------- */
      .section {
        padding: 72px 0 8px;
      }
      .section-head {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-dim);
        text-transform: lowercase;
        letter-spacing: 0.02em;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .section-head .prompt {
        color: var(--accent);
      }
      .section-head .cmd {
        color: var(--fg);
      }
      .section-head .rule {
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, var(--line) 0%, transparent 100%);
      }

      /* ---------- hero / terminal ---------- */
      .hero {
        padding: 88px 0 8px;
      }
      .terminal {
        border: 1px solid var(--line);
        background: var(--bg-1);
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.75;
      }
      .terminal-titlebar {
        border-bottom: 1px solid var(--line);
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--fg-dimmer);
        font-size: 11px;
      }
      .terminal-titlebar .dots {
        display: flex;
        gap: 6px;
      }
      .terminal-titlebar .dot {
        width: 9px;
        height: 9px;
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
      }
      .terminal-titlebar .path {
        margin-left: 8px;
        letter-spacing: 0.02em;
      }
      .terminal-titlebar .meta {
        margin-left: auto;
      }

      .terminal-body {
        padding: 18px 22px 22px;
      }
      .line {
        display: block;
        color: var(--fg);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .line + .line {
        margin-top: 0;
      }
      .blank {
        height: 12px;
      }
      .prompt-line {
        color: var(--fg-dim);
      }
      .prompt-line .user {
        color: var(--accent);
      }
      .prompt-line .at {
        color: var(--fg-dimmer);
      }
      .prompt-line .host {
        color: var(--fg-dim);
      }
      .prompt-line .dollar {
        color: var(--fg-dimmer);
        margin: 0 6px 0 4px;
      }
      .prompt-line .cmd {
        color: var(--fg);
      }
      .prompt-line .flag {
        color: var(--fg-dim);
      }
      .out {
        color: var(--fg);
      }
      .out.dim {
        color: var(--fg-dim);
      }
      .out.accent {
        color: var(--accent);
      }
      .out .k {
        color: var(--fg-dim);
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 1.05em;
        background: var(--accent);
        vertical-align: -2px;
        margin-left: 2px;
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink {
        to {
          background: transparent;
        }
      }

      /* prompt input row (live, at bottom of terminal) */
      .prompt-input-row {
        display: flex;
        align-items: center;
        color: var(--fg-dim);
      }
      .prompt-input-row input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 13.5px;
        flex: 1;
        padding: 0;
        margin-left: 2px;
        caret-color: var(--accent);
      }
      .prompt-input-row .hint {
        color: var(--fg-dimmer);
        font-size: 11px;
        margin-left: 12px;
      }

      /* ---------- projects ---------- */
      .projects {
        display: flex;
        flex-direction: column;
      }
      .project {
        border-top: 1px solid var(--line);
        padding: 22px 4px;
        display: grid;
        grid-template-columns: 110px 1fr auto;
        gap: 28px;
        align-items: baseline;
        cursor: pointer;
        transition: background 140ms ease;
      }
      .project:last-child {
        border-bottom: 1px solid var(--line);
      }
      .project:hover {
        background: rgba(255, 255, 255, 0.012);
      }
      .project:hover .proj-name {
        color: var(--accent);
      }
      .project-meta {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-dimmer);
        letter-spacing: 0.02em;
        padding-top: 4px;
      }
      .project-main {
        min-width: 0;
      }
      .proj-name {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 500;
        color: var(--fg);
        letter-spacing: -0.01em;
        transition: color 120ms ease;
      }
      .proj-name .star {
        color: var(--fg-dimmer);
        font-weight: 400;
        margin-left: 8px;
        font-size: 12px;
      }
      .proj-blurb {
        margin-top: 4px;
        color: var(--fg-dim);
        font-size: 14px;
        line-height: 1.55;
      }
      .proj-stack {
        margin-top: 10px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-dim);
      }
      .proj-stack span::before {
        content: "·";
        margin-right: 8px;
        color: var(--fg-dimmer);
      }
      .proj-stack span:first-child::before {
        content: "";
        margin: 0;
      }

      .proj-expand {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-dimmer);
        user-select: none;
        padding-top: 6px;
      }
      .project.open .proj-expand .chev {
        transform: rotate(90deg);
      }
      .proj-expand .chev {
        display: inline-block;
        width: 8px;
        transition: transform 160ms ease;
        color: var(--accent);
      }

      .proj-detail {
        grid-column: 2 / 4;
        margin-top: 14px;
        padding: 14px 16px;
        border-left: 2px solid var(--accent-dim);
        background: var(--accent-faint);
        color: var(--fg);
        font-size: 13.5px;
        line-height: 1.65;
        overflow: hidden;
      }
      .proj-detail p + p {
        margin-top: 8px;
      }
      .proj-detail .links {
        margin-top: 12px;
        display: flex;
        gap: 18px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .proj-detail .links a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px dashed var(--accent-dim);
        padding-bottom: 1px;
      }
      .proj-detail .links a:hover {
        border-bottom-style: solid;
      }
      .proj-detail .lessons {
        margin-top: 10px;
        color: var(--fg-dim);
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .proj-detail .lessons b {
        color: var(--fg);
        font-weight: 500;
      }

      /* ---------- blog ---------- */
      .posts {
        display: flex;
        flex-direction: column;
      }
      .post {
        border-top: 1px solid var(--line);
        padding: 18px 4px;
        display: grid;
        grid-template-columns: 110px 1fr auto;
        gap: 28px;
        align-items: baseline;
        cursor: pointer;
        transition: background 140ms ease;
        color: inherit;
        text-decoration: none;
      }
      .post:last-child {
        border-bottom: 1px solid var(--line);
      }
      .post:hover {
        background: rgba(255, 255, 255, 0.012);
      }
      .post:hover .post-title {
        color: var(--accent);
      }
      .post-date {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-dimmer);
        letter-spacing: 0.02em;
      }
      .post-title {
        font-family: var(--mono);
        font-weight: 400;
        font-size: 14.5px;
        color: var(--fg);
        letter-spacing: -0.005em;
        transition: color 120ms ease;
      }
      .post-snippet {
        color: var(--fg-dim);
        font-size: 13px;
        margin-top: 3px;
      }
      .post-readtime {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-dimmer);
      }

      /* ---------- contact ---------- */
      .contact-card {
        border: 1px solid var(--line);
        background: var(--bg-1);
        padding: 26px 28px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px 40px;
        font-family: var(--mono);
        font-size: 13px;
      }
      .contact-field .k {
        color: var(--fg-dim);
        font-size: 11px;
        margin-bottom: 4px;
        text-transform: lowercase;
        letter-spacing: 0.04em;
      }
      .contact-field .v {
        color: var(--fg);
      }
      .contact-field a {
        color: var(--fg);
        text-decoration: none;
        border-bottom: 1px dashed var(--line-2);
        padding-bottom: 1px;
      }
      .contact-field a:hover {
        color: var(--accent);
        border-bottom-color: var(--accent-dim);
      }
      .contact-field .v.dim {
        color: var(--fg-dim);
        font-size: 12.5px;
        line-height: 1.55;
      }

      .availability {
        grid-column: 1 / -1;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--fg-dim);
        font-size: 12.5px;
      }
      .availability .pulse {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--accent);
        box-shadow: 0 0 0 0 var(--accent);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 var(--accent-dim);
        }
        70% {
          box-shadow: 0 0 0 8px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .availability .accent {
        color: var(--accent);
      }

      /* ---------- footer ---------- */
      footer {
        margin-top: 88px;
        border-top: 1px solid var(--line);
        padding: 26px 0 60px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-dimmer);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      footer .right {
        display: flex;
        gap: 18px;
      }
      footer a {
        color: var(--fg-dim);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--fg);
      }

      /* ---------- focus / a11y ---------- */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 680px) {
        .topbar-inner {
          padding: 12px 20px;
        }
        .shell {
          padding: 0 20px;
        }
        .navlinks {
          gap: 14px;
          font-size: 12px;
        }
        .project,
        .post {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .project-meta,
        .post-date {
          font-size: 11px;
        }
        .proj-expand,
        .post-readtime {
          display: none;
        }
        .proj-detail {
          grid-column: 1 / -1;
          margin-top: 12px;
        }
        .contact-card {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 22px;
        }
        .terminal-body {
          padding: 14px 16px 18px;
          font-size: 12.5px;
        }
        .terminal {
          font-size: 12.5px;
        }
      }
    </style>
  </head>
  <body style="background-color: rgb(13, 13, 13); font-family: Inter">
    <div id="app"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel">
      /* global React, ReactDOM, TweaksPanel, useTweaks, TweakSection, TweakSlider, TweakRadio, TweakToggle */
      const { useState, useEffect, useRef, useMemo } = React;

      /* ----------------------------------------------------------------
   data — kept honest. a junior dev. small, scoped, real projects.
---------------------------------------------------------------- */

      const PROJECTS = [
        {
          id: "ghostnotes",
          year: "2026",
          name: "ghostnotes v1.0.2",
          blurb:
            "A CLI that lets you leave personal comments in code without the risk of pushing them to the remote. Built it because I was embarrassed of some of the notes I was leaving for myself on collaborative projects.",
          stack: ["python", "git"],
          star: "★ 6",
          detail: [
            "Installs a pre-commit hook that strips lines tagged with GN: from staged files. It only touches the git index, so your notes stay on disk but never make it into a commit.",
            "Got there by going through git's plumbing: git show :file to read the staged blob, hash-object to write a new one, update-index --cacheinfo to point the index at it.",
            "Also wrote a pull flow that pulls your notes out before a git pull and puts them back after, so upstream changes don't conflict with your annotations.",
          ],
          lessons:
            "what i learned: git's porcelain commands are a thin layer over a much more interesting set of plumbing commands. once you see the index as just a tree of blobs you can rewrite, a lot of git stops feeling like magic.",
          links: [
            {
              label: "github →",
              href: "https://github.com/duna-akin/ghostnotes",
            },
            {
              label: "pypi →",
              href: "https://pypi.org/project/ghostnotes/",
            },
          ],
        },
      ];

      const POSTS = [];

      /* ----------------------------------------------------------------
   hero terminal — finished session, not a typewriter
---------------------------------------------------------------- */

      function Hero({ accentHue }) {
        const [showInputCursor, setShowInputCursor] = useState(true);
        const [cmd, setCmd] = useState("");
        const [history, setHistory] = useState([]);
        const inputRef = useRef(null);

        function runCommand(raw) {
          const c = raw.trim().toLowerCase();
          if (!c) return;
          let out;
          if (c === "help" || c === "?") {
            out = (
              <span className="out dim">
                available:{" "}
                <span className="out">
                  whoami, ls, cat about.md, contact, clear
                </span>
              </span>
            );
          } else if (c === "whoami") {
            out = (
              <span className="out">tuna akin, junior software developer</span>
            );
          } else if (c === "ls" || c === "ls -la") {
            out = (
              <span className="out">
                <span className="k">drwxr-xr-x</span> projects/{" "}
                <span className="k">drwxr-xr-x</span> blog/{" "}
                <span className="k">drwxr-xr-x</span> contact/
              </span>
            );
          } else if (c === "cat about.md" || c === "about") {
            out = (
              <span className="out dim">
                Pennsylvania. Senior in college. Currently interning for Merck
                and developing a venture. Open to collaboration
              </span>
            );
          } else if (c === "contact") {
            out = (
              <span className="out">
                scroll down, or:{" "}
                <a
                  href="mailto:tuna.takin@gmail.com"
                  style={{ color: "var(--accent)" }}
                >
                  tuna.takin@gmail.com
                </a>
              </span>
            );
          } else if (c === "clear") {
            setHistory([]);
            setCmd("");
            return;
          } else if (c === "sudo make me a sandwich") {
            out = (
              <span className="out dim">
                Permission denied. You're not in the sudoers file.
              </span>
            );
          } else {
            out = (
              <span className="out dim">
                command not found: {c} — try <span className="out">help</span>
              </span>
            );
          }
          setHistory((h) => [...h, { cmd: raw, out }]);
          setCmd("");
        }

        function onKey(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            runCommand(cmd);
          }
        }

        return (
          <section className="hero shell" id="top">
            <div className="terminal" role="region" aria-label="terminal hero">
              <div className="terminal-titlebar">
                <div className="dots">
                  <span className="dot" />
                  <span className="dot" />
                  <span className="dot" />
                </div>
                <span className="path">
                  tuna@akin — ~/portfolio — zsh — 88×24
                </span>
                <span className="meta">v1.1</span>
              </div>
              <div
                className="terminal-body"
                onClick={() => inputRef.current?.focus()}
              >
                <PromptLine cmd="whoami" />
                <div className="line out">
                  tuna akin, junior software dev and builder
                </div>
                <div className="blank" />

                <PromptLine
                  cmd={
                    <>
                      cat <span className="flag">about.md</span>
                    </>
                  }
                />
                <div className="line out">
                  Based in Pennsylvania. Senior in college. Currently
                </div>
                <div className="line out">
                  interning at Merck and building my own venture.
                </div>
                <div className="line out">
                  hit me up if you want to collaborate or talk
                </div>
                <div className="blank" />
                <div className="line out dim">
                  I like coding, well-named things, and products that
                </div>
                <div className="line out dim">
                  surpasses the person who initially made it
                </div>
                <div className="blank" />

                <PromptLine
                  cmd={
                    <>
                      ls <span className="flag">-la</span>
                    </>
                  }
                />
                <div className="line out">
                  <span className="k">drwxr-xr-x</span>{" "}
                  <span style={{ color: "var(--accent)" }}>projects/</span>
                  things i built / building
                </div>
                <div className="line out">
                  <span className="k">drwxr-xr-x</span>{" "}
                  <span style={{ color: "var(--accent)" }}>blog/</span>{" "}
                  notes-to-self, posted in public; currently none
                </div>
                <div className="line out">
                  <span className="k">drwxr-xr-x</span>{" "}
                  <span style={{ color: "var(--accent)" }}>contact/</span> email
                  + socials
                </div>
                <div className="blank" />

                {history.map((h, i) => (
                  <React.Fragment key={i}>
                    <PromptLine cmd={h.cmd} />
                    <div className="line">{h.out}</div>
                    <div className="blank" />
                  </React.Fragment>
                ))}

                <div className="prompt-input-row">
                  <span className="prompt-line">
                    <span className="user">tuna</span>
                    <span className="at">@</span>
                    <span className="host">akin</span>
                    <span className="dollar">$</span>
                  </span>
                  <input
                    ref={inputRef}
                    value={cmd}
                    onChange={(e) => setCmd(e.target.value)}
                    onKeyDown={onKey}
                    onFocus={() => setShowInputCursor(false)}
                    onBlur={() => setShowInputCursor(true)}
                    spellCheck={false}
                    autoCapitalize="off"
                    autoCorrect="off"
                    aria-label="terminal input"
                  />
                  {showInputCursor && cmd === "" && (
                    <span className="cursor" aria-hidden="true" />
                  )}
                  <span className="hint">try: help</span>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function PromptLine({ cmd }) {
        return (
          <div className="line prompt-line">
            <span className="user">tuna</span>
            <span className="at">@</span>
            <span className="host">akin</span>
            <span className="dollar">$</span>
            <span className="cmd">{cmd}</span>
          </div>
        );
      }

      /* ----------------------------------------------------------------
   sections
---------------------------------------------------------------- */

      function SectionHead({ cmd, id }) {
        return (
          <div className="section-head" id={id}>
            <span className="prompt">$</span>
            <span className="cmd">{cmd}</span>
            <span className="rule" />
          </div>
        );
      }

      function Projects() {
        const [open, setOpen] = useState(null);
        return (
          <section className="section shell">
            <SectionHead cmd="ls projects/" id="projects" />
            <div className="projects">
              {PROJECTS.map((p) => {
                const isOpen = open === p.id;
                return (
                  <div
                    key={p.id}
                    className={`project${isOpen ? " open" : ""}`}
                    onClick={() => setOpen(isOpen ? null : p.id)}
                    role="button"
                    tabIndex={0}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        setOpen(isOpen ? null : p.id);
                      }
                    }}
                  >
                    <div className="project-meta">{p.year}</div>
                    <div className="project-main">
                      <div className="proj-name">
                        {p.name}
                        {p.star && <span className="star">{p.star}</span>}
                      </div>
                      <div className="proj-blurb">{p.blurb}</div>
                      <div className="proj-stack">
                        {p.stack.map((s) => (
                          <span key={s}>{s}</span>
                        ))}
                      </div>
                      {isOpen && (
                        <div className="proj-detail">
                          {p.detail.map((d, i) => (
                            <p key={i}>{d}</p>
                          ))}
                          <div className="lessons">// {p.lessons}</div>
                          <div className="links">
                            {p.links.map((l) => (
                              <a
                                key={l.label}
                                href={l.href}
                                onClick={(e) => e.stopPropagation()}
                              >
                                {l.label}
                              </a>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                    <div className="proj-expand">
                      <span className="chev">›</span>{" "}
                      {isOpen ? "close" : "expand"}
                    </div>
                  </div>
                );
              })}
            </div>
          </section>
        );
      }

      function Blog() {
        return (
          <section className="section shell">
            <SectionHead cmd="cat blog/index.md" id="blog" />
            <div className="posts">
              {POSTS.map((p) => (
                <a
                  key={p.title}
                  href="#"
                  className="post"
                  onClick={(e) => e.preventDefault()}
                >
                  <div className="post-date">{p.date}</div>
                  <div>
                    <div className="post-title">{p.title}</div>
                    <div className="post-snippet">{p.snippet}</div>
                  </div>
                  <div className="post-readtime">{p.readtime}</div>
                </a>
              ))}
            </div>
          </section>
        );
      }

      function Contact() {
        return (
          <section className="section shell">
            <SectionHead cmd="cat contact.txt" id="contact" />
            <div className="contact-card">
              <div className="contact-field">
                <div className="k">email</div>
                <div className="v">
                  <a href="mailto:tuna.takin@gmail.com">tuna.takin@gmail.com</a>
                </div>
              </div>
              <div className="contact-field">
                <div className="k">github</div>
                <div className="v">
                  <a href="https://github.com/duna-akin">
                    github.com/duna-akin
                  </a>
                </div>
              </div>
              <div className="contact-field">
                <div className="k">based in</div>
                <div className="v dim">PA</div>
              </div>
              <div className="contact-field">
                <div className="k">elsewhere</div>
                <div className="v dim">not on twitter.</div>
              </div>
              <div className="availability">
                <span className="pulse" />
                <span>
                  currently <span className="accent">open to new roles</span>{" "}
                  and <span className="accent">collaboration</span>
                </span>
              </div>
            </div>
          </section>
        );
      }

      /* ----------------------------------------------------------------
   top bar + footer
---------------------------------------------------------------- */

      function TopBar() {
        return (
          <div className="topbar">
            <div className="topbar-inner">
              <div className="brand">
                <span className="accent">tuna</span>
                <span className="at">@</span>
                <span className="host">akin.dev</span>
              </div>
              <nav className="navlinks">
                <a href="#projects">
                  <span className="hash">/</span>projects
                </a>
                <a href="#blog">
                  <span className="hash">/</span>blog
                </a>
                <a href="#contact">
                  <span className="hash">/</span>contact
                </a>
              </nav>
            </div>
          </div>
        );
      }

      function Footer() {
        const year = new Date().getFullYear();
        return (
          <footer className="shell">
            <div className="left">// last updated on may 15, 2026</div>
            <div className="right">
              <a href="#top">back to top ↑</a>
              <span>© {year}</span>
            </div>
          </footer>
        );
      }

      /* ----------------------------------------------------------------
   tweaks
---------------------------------------------------------------- */

      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/ {
        accentHue: 55,
        textureMode: "both",
        scanIntensity: 25,
      }; /*EDITMODE-END*/

      function App() {
        const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

        useEffect(() => {
          const root = document.documentElement;
          root.style.setProperty("--accent-h", t.accentHue);
          const gridOn = t.textureMode === "grid" || t.textureMode === "both";
          const scanOn = t.textureMode === "scan" || t.textureMode === "both";
          root.style.setProperty("--grid-alpha", gridOn ? 0.04 : 0);
          root.style.setProperty(
            "--scan-alpha",
            scanOn ? t.scanIntensity / 1000 : 0,
          );
        }, [t.accentHue, t.textureMode, t.scanIntensity]);

        return (
          <>
            <TopBar />
            <Hero accentHue={t.accentHue} />
            <Projects />
            <Blog />
            <Contact />
            <Footer />

            <TweaksPanel title="Tweaks">
              <TweakSection label="Accent">
                <TweakSlider
                  label="hue"
                  value={t.accentHue}
                  min={45}
                  max={95}
                  step={1}
                  onChange={(v) => setTweak("accentHue", v)}
                />
                <div
                  style={{
                    fontFamily: "var(--mono)",
                    fontSize: 11,
                    color: "var(--fg-dimmer)",
                    marginTop: -4,
                  }}
                >
                  45 = orange · 75 = amber · 95 = yellow-green. stays warm.
                </div>
              </TweakSection>
              <TweakSection label="Texture">
                <TweakRadio
                  label="layers"
                  value={t.textureMode}
                  options={[
                    { value: "off", label: "off" },
                    { value: "grid", label: "grid" },
                    { value: "scan", label: "scan" },
                    { value: "both", label: "both" },
                  ]}
                  onChange={(v) => setTweak("textureMode", v)}
                />
                <TweakSlider
                  label="scanline strength"
                  value={t.scanIntensity}
                  min={0}
                  max={60}
                  step={1}
                  onChange={(v) => setTweak("scanIntensity", v)}
                />
              </TweakSection>
            </TweaksPanel>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    </script>
  </body>
</html>
